AWSTemplateFormatVersion: "2010-09-09"
Description: GPU execution plane for the AI Art Games scene compiler. Deploying this stack can incur substantial AWS charges.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  WorkerImage:
    Type: String
    Description: Full ECR image URI for the scene compiler worker
  MaxvCpus:
    Type: Number
    Default: 192

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 500
              VolumeType: gp3

  WorkerJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SceneCompilerArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        InstanceTypes:
          - p4de.24xlarge
        Subnets: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
        InstanceRole: !GetAtt InstanceProfile.Arn
        Ec2Configuration:
          - ImageType: ECS_AL2_NVIDIA
        LaunchTemplate:
          LaunchTemplateId: !Ref GpuLaunchTemplate
          Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      State: ENABLED
      Priority: 100
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities:
        - EC2
      ContainerProperties:
        Image: !Ref WorkerImage
        JobRoleArn: !GetAtt WorkerJobRole.Arn
        Vcpus: 96
        Memory: 900000
        ResourceRequirements:
          - Type: GPU
            Value: "8"
        LinuxParameters:
          SharedMemorySize: 131072
        Environment:
          - Name: HF_HOME
            Value: /models/huggingface
          - Name: TORCH_HOME
            Value: /models/torch
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 14400

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  BatchQueue:
    Value: !Ref JobQueue
  JobDefinition:
    Value: !Ref JobDefinition
